name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python main.py setup
      - run: python -m unittest discover -s tests -v
      - run: python scripts/benchmark_intencao.py
      - run: python scripts/evaluate_v3.py
      - run: python scripts/verify_installation.py
  optional-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-api.lock.txt
      - run: python main.py setup
      - run: python -m unittest discover -s tests -v
